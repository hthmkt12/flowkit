<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FBKit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .version {
      font-size: 11px;
      color: #888;
      margin-left: auto;
    }
    .status-card {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }
    .status-row .label {
      font-size: 12px;
      color: #aaa;
    }
    .status-row .value {
      font-size: 12px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 6px;
    }
    .dot.green { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.5); }
    .dot.red { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.5); }
    .dot.yellow { background: #facc15; box-shadow: 0 0 6px rgba(250,204,21,0.5); }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: #ccc;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.12); }
    #error { color: #f87171; font-size: 11px; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ FBKit</h1>
    <span class="version">v1.0.0</span>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span class="label">Agent</span>
      <span class="value" id="agent-status"><span class="dot red"></span>Offline</span>
    </div>
    <div class="status-row">
      <span class="label">Facebook</span>
      <span class="value" id="fb-status"><span class="dot yellow"></span>Unknown</span>
    </div>
    <div class="status-row">
      <span class="label">Tasks</span>
      <span class="value" id="task-count">—</span>
    </div>
  </div>

  <button class="btn btn-primary" id="btn-check">🔍 Check Status</button>
  <button class="btn btn-secondary" id="btn-dashboard">📊 Open Dashboard</button>

  <div id="error"></div>

  <script src="popup.js"></script>
</body>
</html>
